
    {% load static %}
    {%load blog_tags %}
    <!DOCTYPE html>
    <html>
        <head>
            <meta charset="utf-8">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
            <title>
            {%block title%}{%endblock%}
            </title>
            {%block style%}
            <style>
        .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .card {
        background: #ffffff;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    }

    .card h4 {
        margin: 0 0 10px 0;
        font-size: 18px;
    }

    .card h4 a {
        text-decoration: none;
        color: #333;
    }

    .description {
        font-size: 14px;
        color: #666;
        margin-bottom: 14px;
    }

    .card-actions {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
    }

    .card-actions a {
        text-decoration: none;
        color: #2b6cb0;
    }

    .card-actions a.danger {
        color: #c53030;
    }
            

    .header{
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background-color: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
    }
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    background-color: #594a02;
}

    main{
        flex: 1;
        background-color: #594a02;
    }

    .footer{
        background-color: #ccc;
        height:20px;
        
    }
    
    aside {
        height:40px;
        background-color: #DEC445;
    }

    .content-wrapper{
        display: flex;
        align-items: stretch;
    }

    .content-left{
        width: 34%;
        background-color: #CC00CC;
    }
    .content-middle{
        width: 33%;
        background-color: #F5059A;
    }
    .content-right{
        width: 33%;
        background-color: #CCAACC;
    }
    .button-div a{
        text-decoration: none;
    }
    .button-div button{
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        background-color: #0d6efd;
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .button-div button:hover {
        background-color: #0b5ed7;
    }

    .button-div button:active {
        transform:scale(0.97);
    }

    .button-sidebar {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px;
    }

    .button-div {
        display: inline-flex;
    }
    .button-parameter{
        border: 2px solid red;
        background-color:transparent;
    }

    .button-parameter:first-child p{
        border:2px solid blue;
    }
    {% block stylein %}
    
    {% endblock %}
            </style>
            {%endblock%}
            <link href="{% static 'css/style.css'%}" rel="stylesheet" type="text/css"/>
        </head>
        <body>
            <header>
                <div class="header">
                    {%buttons%}
                </div>
            </header>
        
        <aside>
            <div class="sidebar">
                {%block sidebar%}Слова для sidebar{%endblock%}
            </div>
        </aside>
        <main >
            {%block content%}
            {%endblock%}
        </main>
        
            <footer>
                <div class="footer" >
                    Подвал
                </div>
            </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        </body>

    </html>
