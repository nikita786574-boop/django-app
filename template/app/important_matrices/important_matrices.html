{%extends 'base.html' %}

{%block title%}Матрица важности{%endblock%}


{%block content%}
<h2>{{goal_parameter.name}}</h2>

<div class="d-flex justify-content-center align-items-center gap-5">

    <table class="table table-bordered text-center w-auto">
        <tbody>
            {%for row in matrix_same_level%}
            <tr>
                {%for j in row%}
                    <td>{{j}}</td>
                {%endfor%}
            </tr>
            {%endfor%}
        </tbody>
    </table>
<!--
    <table class="table table-bordered text-center w-auto">

            {%for row in matrix_low_level%}
                <tr>
                    {%for i in row%}
                        <td>{{i}}</td>
                    {%endfor%}
                </tr>
            {%endfor%}
        </tbody>
    </table>
-->
    <div class="d-flex flex-column gap-2">
        <a href="{% url 'important_matrices_process' goal_parameter.name goal_parameter.subsystem.name goal_parameter.number %}">
            <button type="button" class="btn btn-primary">Определить важность параметров</button>
        </a>
        <a href="{% url 'relation_type_matrix' goal_parameter.name goal_parameter.subsystem.name goal_parameter.number %}">
            <button type="button" class="btn btn-secondary">Таблица 27: типы связей</button>
        </a>
    </div>
</div>
{%endblock%}
