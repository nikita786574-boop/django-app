{%extends 'base.html'%}

{%block content%}
{% if parameters_goal %}
    <div class="grid">
        {% for paramet in parameters_goal %}
        <div class="card">
            <h4>
                <a href="{%url 'parameters_tree_goal_show' paramet.slug %}">
                    {{ paramet.name }}
                </a>
                <a href="{%url 'goal_parameters_tree' paramet.slug %}">
                    {{ paramet.name }}
                </a>
            </h4>

            <p class="description">
                {{ paramet.description|default:"Без описания" }}
            </p>

            <div class="card-actions">
                <a href="{% url 'edit_subsystem' nodes.0.slug %}">✏️ Изменить</a>
                <a href="{% url 'del_system' nodes.0.slug %}" class="danger">🗑 Удалить</a>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
        <p>Нету подсистем</p>
    {% endif %}
{%endblock%}
